version: '3.8'

services:
  db:
    image: mysql:8.1
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: supersecretpassword
      MYSQL_DATABASE: economy
      MYSQL_USER: myuser
      MYSQL_PASSWORD: mypassword
    volumes:
      - mysqldata:/var/lib/mysql
      - ./src/db/init.sql:/docker-entrypoint-initdb.d/init.sql

  api:
    build: .
    restart: always
    environment:
      DB_USER: myuser
      DB_PASSWORD: mypassword
      DB_HOST: db
      DB_NAME: economy
      DB_PORT: 3306
      JWT_SECRET: supersecretkey
      PORT: 3000
    depends_on:
      - db

  caddy:
    image: caddy:latest
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - api

volumes:
  mysqldata:
  caddy_data:
  caddy_config: