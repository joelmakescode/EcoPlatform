version: '3.8'

services:
  db:
    image: postgres:16
    container_name: economy-db
    restart: always
    environment:
      POSTGRES_USER: myuser
      POSTGRES_PASSWORD: mypassword
      POSTGRES_DB: economy
    ports:
      - "5432:5432"  
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./src/db/init.sql:/docker-entrypoint-initdb.d/init.sql

  api:
    build: .  
    container_name: economy-api
    restart: always
    environment:
      DB_USER: myuser
      DB_PASSWORD: mypassword
      DB_HOST: db         
      DB_NAME: economy
      DB_PORT: 5432
      JWT_SECRET: supersecretkey
      PORT: 3000
    depends_on:
      - db
    ports:
      - "3000:3000" 

volumes:
  pgdata: