<div class="username-input">
  <h3>{{ placeholderTitle }}</h3>

  <input
    type="text"
    [placeholder]="placeholder"
    [disabled]="disabled"
    [value]="value"
    (input)="onInput($event)"
    autocomplete="new-password"
    autocapitalize="off"
    spellcheck="false"
  >

  <ul *ngIf="showSuggestions && suggestions.length">
    <li *ngFor="let user of suggestions" (click)="selectUser(user)">
      {{  user.username }}
    </li>
  </ul>
</div>
